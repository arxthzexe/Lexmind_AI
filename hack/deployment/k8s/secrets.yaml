apiVersion: v1
kind: Namespace
metadata:
  name: lexmind
---
apiVersion: v1
kind: Secret
metadata:
  name: lexmind-secrets
  namespace: lexmind
type: Opaque
stringData:
  POSTGRES_PASSWORD: lexmind_prod_secret
  MINIO_ROOT_PASSWORD: lexmind_prod_secret_strong
  NEO4J_PASSWORD: lexmind_prod_secret
  JWT_SECRET_KEY: lexmind_prod_secret_change
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lexmind-config
  namespace: lexmind
data:
  DATABASE_URL: postgresql+asyncpg://lexmind:$(POSTGRES_PASSWORD)@postgres.lexmind.svc.cluster.local:5432/lexmind
  NEO4J_URI: bolt://neo4j.lexmind.svc.cluster.local:7687
  QDRANT_URL: http://qdrant.lexmind.svc.cluster.local:6333
  MINIO_ENDPOINT: http://minio.lexmind.svc.cluster.local:9000
  VLLM_URL: http://vllm.lexmind.svc.cluster.local:8000/v1
  EMBEDDING_URL: http://embedding-service.lexmind.svc.cluster.local:8080
  LLM_MODEL: mistralai/Mistral-7B-Instruct-v0.2
  JWT_ALGORITHM: HS256
  JWT_EXPIRATION_MINUTES: "60"