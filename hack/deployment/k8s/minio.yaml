apiVersion: apps/v1
kind: Deployment
metadata: {name: minio, namespace: lexmind}
spec:
  replicas: 1
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        args: [server, /data, --console-address, ":9001"]
        env:
        - {name: MINIO_ROOT_USER, value: lexmind}
        - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: lexmind-secrets, key: MINIO_ROOT_PASSWORD}}}
        ports: [{containerPort: 9000}, {containerPort: 9001}]
        volumeMounts: [{name: minio-data, mountPath: /data}]
        readinessProbe:
          httpGet: {path: /minio/health/live, port: 9000}
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: minio-data
        persistentVolumeClaim: {claimName: minio-pvc}
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: lexmind}
spec:
  selector: {app: minio}
  ports: [{port: 9000, targetPort: 9000}, {port: 9001, targetPort: 9001}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: minio-pvc, namespace: lexmind}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 50Gi}}