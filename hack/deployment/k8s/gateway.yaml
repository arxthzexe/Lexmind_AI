apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: lexmind}
spec:
  replicas: 2
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
      - name: gateway
        image: lexmind/gateway:latest
        ports: [{containerPort: 80}]
        envFrom: [{configMapRef: {name: lexmind-config}}]
        env:
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: lexmind-secrets, key: POSTGRES_PASSWORD}}}
        - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: lexmind-secrets, key: MINIO_ROOT_PASSWORD}}}
        - {name: NEO4J_PASSWORD, valueFrom: {secretKeyRef: {name: lexmind-secrets, key: NEO4J_PASSWORD}}}
        - {name: JWT_SECRET_KEY, valueFrom: {secretKeyRef: {name: lexmind-secrets, key: JWT_SECRET_KEY}}}
        readinessProbe:
          httpGet: {path: /health, port: 80}
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: lexmind}
spec:
  selector: {app: gateway}
  ports: [{port: 80, targetPort: 80}]
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: gateway, namespace: lexmind}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}