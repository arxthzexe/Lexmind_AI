[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexmind-ocr-service"
version = "0.1.0"
description = "OCR service for LexMind AI Document Intelligence pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.108",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pillow>=10.2",
    "numpy>=1.24"
]

[project.optional-dependencies]
docling = ["docling>=2.20"]
paddle = ["paddleocr>=2.9"]
easy = ["easyocr>=1.7"]
all = ["docling>=2.20", "paddleocr>=2.9", "easyocr>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ocr_service*"]