name: lexmind-ai
version: "1.0.0"
description: "Enterprise Legal Intelligence Platform (LexMind AI)"
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: lexmind
      POSTGRES_PASSWORD: lexmind_dev
      POSTGRES_DB: lexmind
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexmind"]
      interval: 5s
      timeout: 5s
      retries: 5
  neo4j:
    image: neo4j:5.14
    environment:
      NEO4J_AUTH: neo4j/lexmind_dev
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_export_file_acl: "*"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_plugins: "[apoc]"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 10s
      retries: 6
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant-data:/qdrant/storage"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 5s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lexmind
      MINIO_ROOT_PASSWORD: lexmind_dev_strong
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
  vllm:
    image: vllm/vllm:latest
    command: --model /models --host 0.0.0.0 --port 8000 --dtype half --max-model-len 4096
    environment:
      VLLM_MODEL: "mistralai/Mistral-7B-Instruct-v0.2"
    ports: ["8000:8000"]
    volumes: ["./models:/models"]
    deploy:
      resources:
        limits:
          memory: 16G
  embedding-server:
    image: ghcr.io/mixedbread/embedding-service:latest
    command: --model-id BAAI/bge-m3 --max-batch-size 32
    ports: ["8082:8080"]

  # --- LexMind AI backend services ---
  gateway:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      args: {SERVICE: gateway, ENTRYPOINT: main:app}
    ports: ["80:80"]
    environment:
      DATABASE_URL: postgresql+asyncpg://lexmind:lexmind_dev@postgres:5432/lexmind
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: lexmind_dev
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: lexmind
      MINIO_ROOT_PASSWORD: lexmind_dev_strong
      VLLM_URL: http://vllm:8000/v1
      EMBEDDING_URL: http://embedding-server:8080
      JWT_SECRET_KEY: lexmind_dev_secret_change_in_prod
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}
      vllm: {condition: service_started}
      embedding-server: {condition: service_started}

  document_service:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      args: {SERVICE: document_service, ENTRYPOINT: main:app}
    ports: ["8081:80"]

  ocr_service:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      args: {SERVICE: ocr_service, ENTRYPOINT: main:app}
    ports: ["8083:80"]
    depends_on: [vllm]

  layout_service:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      args: {SERVICE: layout_service, ENTRYPOINT: main:app}
    ports: ["8084:80"]

  clause_service:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      args: {SERVICE: clause_service, ENTRYPOINT: main:app}
    ports: ["8085:80"]

  ner_service:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      args: {SERVICE: ner_service, ENTRYPOINT: main:app}
    ports: ["8086:80"]

  obligation_service:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      args: {SERVICE: obligation_service, ENTRYPOINT: main:app}
    ports: ["8087:80"]

  risk_service:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      args: {SERVICE: risk_service, ENTRYPOINT: main:app}
    ports: ["8088:80"]

  compliance_service:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      args: {SERVICE: compliance_service, ENTRYPOINT: main:app}
    ports: ["8089:80"]

  search_service:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      args: {SERVICE: search_service, ENTRYPOINT: main:app}
    ports: ["8090:80"]

  report_service:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      args: {SERVICE: report_service, ENTRYPOINT: main:app}
    ports: ["8091:80"]

  graphrag:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      args: {SERVICE: graphrag, ENTRYPOINT: main:app}
    ports: ["8092:80"]
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: lexmind_dev
      VLLM_URL: http://vllm:8000/v1
      EMBEDDING_URL: http://embedding-server:8080
    depends_on: [qdrant, neo4j, vllm, embedding-server]

  agent_orchestrator:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      args: {SERVICE: agent_orchestrator, ENTRYPOINT: main:app}
    ports: ["8093:80"]
    depends_on: [qdrant, neo4j, vllm]

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:80
    depends_on: [gateway]

volumes:
  pg-data:
  neo4j-data:
  qdrant-data:
  minio-data:
