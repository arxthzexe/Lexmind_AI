[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexmind-shared"
version = "0.1.0"
description = "Shared utilities for LexMind AI backend services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "asyncpg>=0.29",
    "httpx>=0.25",
    "neo4j>=5.14",
    "qdrant-client>=1.7",
    "aioboto3>=12.0",
    "structlog>=23.2",
    "python-jose[cryptography]>=3.3"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["shared*"]