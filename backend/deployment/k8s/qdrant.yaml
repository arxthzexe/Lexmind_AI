apiVersion: apps/v1
kind: Deployment
metadata: {name: qdrant, namespace: lexmind}
spec:
  replicas: 1
  selector: {matchLabels: {app: qdrant}}
  template:
    metadata: {labels: {app: qdrant}}
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest
        ports: [{containerPort: 6333}, {containerPort: 6334}]
        volumeMounts: [{name: qdrant-data, mountPath: /qdrant/storage}]
        readinessProbe:
          httpGet: {path: /health, port: 6333}
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: qdrant-data
        persistentVolumeClaim: {claimName: qdrant-pvc}
---
apiVersion: v1
kind: Service
metadata: {name: qdrant, namespace: lexmind}
spec:
  selector: {app: qdrant}
  ports: [{port: 6333, targetPort: 6333}, {port: 6334, targetPort: 6334}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: qdrant-pvc, namespace: lexmind}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}