apiVersion: apps/v1
kind: Deployment
metadata: {name: neo4j, namespace: lexmind}
spec:
  replicas: 1
  selector: {matchLabels: {app: neo4j}}
  template:
    metadata: {labels: {app: neo4j}}
    spec:
      containers:
      - name: neo4j
        image: neo4j:5.14
        env:
        - {name: NEO4J_AUTH, value: neo4j/$(NEO4J_PASSWORD)}
        - {name: NEO4J_PASSWORD, valueFrom: {secretKeyRef: {name: lexmind-secrets, key: NEO4J_PASSWORD}}}
        - {name: NEO4J_dbms_memory_heap_initial__size, value: 512m}
        - {name: NEO4J_dbms_memory_heap_max__size, value: 1G}
        ports: [{containerPort: 7474}, {containerPort: 7687}]
        volumeMounts: [{name: neo4j-data, mountPath: /data}]
        readinessProbe:
          httpGet: {path: /, port: 7474}
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: neo4j-data
        persistentVolumeClaim: {claimName: neo4j-pvc}
---
apiVersion: v1
kind: Service
metadata: {name: neo4j, namespace: lexmind}
spec:
  selector: {app: neo4j}
  ports: [{port: 7687, targetPort: 7687}, {port: 7474, targetPort: 7474}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: neo4j-pvc, namespace: lexmind}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}