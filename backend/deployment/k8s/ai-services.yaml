apiVersion: apps/v1
kind: Deployment
metadata: {name: vllm, namespace: lexmind}
spec:
  replicas: 1
  selector: {matchLabels: {app: vllm}}
  template:
    metadata: {labels: {app: vllm}}
    spec:
      containers:
      - name: vllm
        image: vllm/vllm:latest
        args: [--model, mistralai/Mistral-7B-Instruct-v0.2, --host, 0.0.0.0, --port, 8000, --dtype, half, --max-model-len, 4096]
        ports: [{containerPort: 8000}]
        resources: {requests: {cpu: 2, memory: 8Gi}, limits: {cpu: 4, memory: 16Gi}}
        readinessProbe:
          httpGet: {path: /v1/models, port: 8000}
          initialDelaySeconds: 30
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata: {name: vllm, namespace: lexmind}
spec:
  selector: {app: vllm}
  ports: [{port: 8000, targetPort: 8000}]
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: embedding-service, namespace: lexmind}
spec:
  replicas: 1
  selector: {matchLabels: {app: embedding-service}}
  template:
    metadata: {labels: {app: embedding-service}}
    spec:
      containers:
      - name: embedding-service
        image: ghcr.io/mixedbread/embedding-service:latest
        args: [--model-id, BAAI/bge-m3, --max-batch-size, 32, --port, 8080]
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 1, memory: 4Gi}, limits: {cpu: 2, memory: 8Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: embedding-service, namespace: lexmind}
spec:
  selector: {app: embedding-service}
  ports: [{port: 8080, targetPort: 8080}]