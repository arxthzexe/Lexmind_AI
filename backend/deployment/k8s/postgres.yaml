apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lexmind
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - {name: POSTGRES_USER, value: lexmind}
        - {name: POSTGRES_DB, value: lexmind}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: lexmind-secrets, key: POSTGRES_PASSWORD}}}
        ports: [{containerPort: 5432}]
        volumeMounts: [{name: pg-data, mountPath: /var/lib/postgresql/data}]
        readinessProbe:
          exec: {command: [sh, -c, "pg_isready -U lexmind"]}
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: pg-data
        persistentVolumeClaim: {claimName: pg-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lexmind
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pg-pvc, namespace: lexmind}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}